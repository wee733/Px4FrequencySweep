/**:
  ros__parameters:
    # Empty for a real vehicle ('/fmu/...'). Set it to match the simulator's UXRCE_DDS_NS,
    # e.g. "/drone0" or "/iris1". A leading slash is added automatically if omitted.
    # Verify with: ros2 node info /frequency_sweep_mode   (compare against ros2 topic list)
    px4_topic_namespace_prefix: ""

    # PX4 external-mode registration. Keep the displayed name shorter than 25 characters.
    mode.name: "Frequency Sweep"
    # ROS 1 ran its control loop at 150 Hz. At 20 Hz that is 7.5 samples per cycle.
    mode.update_rate_hz: 150.0
    mode.prevent_arming: true
    mode.activate_even_while_disarmed: false

    # "configured": on activation the mode flies to configured_position_ned_m, then treats it as
    # the origin for every stage offset and every safety deviation limit. Use this to start every
    # sweep from the same absolute point so multiple flights are geometrically comparable.
    # "activation": whatever point the pilot hands over at becomes the origin, and no transit
    # happens -- configured_position_ned_m is then ignored entirely.
    #
    # These are absolute PX4 local NED metres, so they are relative to the EKF origin: the same
    # numbers mean a different place if you take off somewhere else. NED Z is negative up, and NED
    # X/Y are North/East, not body forward/right.
    reference.position_source: "configured"
    reference.configured_position_ned_m: [5.0, 0.0, -2.6]

    reference.yaw_source: "configured"
    reference.configured_yaw_ned_rad: 0.0
    # Transit budget: how far the mode may fly to reach the reference. Exceeding it aborts, on the
    # assumption that a reference tens of metres away is a mistyped coordinate or a stale EKF
    # origin. Raise it if you deliberately hand over far from the reference.
    reference.max_transit_distance_m: 30.0
    reference.transit_timeout_s: 60.0

    # Sweep shape, shared by every stage.
    sweep.horizontal_frame: "ned"
    # Logarithmic, not linear. A linear 0.1-20 Hz chirp spends 1.21 s below 0.5 Hz -- 0.36 of a
    # cycle -- so the low end carries no usable statistics while still driving the drift.
    sweep.waveform: "logarithmic"
    # 0.3 Hz, not 0.1: measured coherence is flat and featureless at the bottom of the band (the
    # closed rate loop is 0 dB there) while position amplitude goes as a/omega^2.
    sweep.start_frequency_hz: 0.3

    sweep.end_frequency_hz: 8.0
    sweep.duration_s: 60.0
    sweep.phase_offset_rad: 0.0
    # ROS 1 had no fade: the excitation began and ended at full amplitude.
    sweep.fade_in_s: 0.0
    sweep.fade_out_s: 0.0
    sweep.repetitions: 3
    # ROS 1 hovered ~10 s before the first sweep, and return_to_hover() plus its wait loop gave
    # 10-20 s between repetitions.
    sweep.settle_before_s: 10.0
    sweep.settle_between_s: 20.0
    sweep.settling_timeout_s: 60.0
    sweep.position_tolerance_m: 0.2
    sweep.velocity_tolerance_m_s: 0.25
    # 150 Hz / 8 Hz = 18.75, comfortably above this guard.
    sweep.minimum_samples_per_cycle: 10.0

    # One flight covers all three axes, matching ROS 1's --axis all.
    sweep.sequence: ["roll", "pitch", "yaw"]

    # --- Stage profiles -----------------------------------------------------------------------
    # ROS 1 used a DIFFERENT type_mask per axis, so each stage carries its own profile. All three
    # keep the horizontal X/Y components paired, which is what PX4's PositionControl::_inputValid()
    # requires -- it rejects the entire setpoint if only one of X/Y is finite.

    # Roll: excite NED-Y acceleration. VX pinned to 0 to stop orthogonal drift, VY carries the
    # acceleration integral. ROS 1 left IGNORE_VX/IGNORE_VY commented out here.
    stages.roll.target: "acceleration_y"
    stages.roll.amplitude: 3.0
    stages.roll.position_enabled: [false, false, false]
    stages.roll.velocity_enabled: [true, true, true]
    stages.roll.acceleration_enabled: [true, true, true]
    stages.roll.integrator_publish_enabled: [false, true, false]
    stages.roll.yaw_enabled: true
    stages.roll.yaw_rate_enabled: true
    stages.roll.velocity_base_ned_m_s: [0.0, 0.0, 0.0]
    stages.roll.acceleration_base_ned_m_s2: [0.0, 0.0, 0.0]
    stages.roll.yaw_offset_rad: 0.0
    stages.roll.yaw_rate_base_rad_s: 0.0


    stages.pitch.target: "acceleration_x"
    stages.pitch.amplitude: 3.0
    stages.pitch.position_enabled: [false, false, false]
    stages.pitch.velocity_enabled: [true, true, true]
    stages.pitch.acceleration_enabled: [true, true, true]
    stages.pitch.integrator_publish_enabled: [true, false, false]
    stages.pitch.yaw_enabled: true
    stages.pitch.yaw_rate_enabled: true
    stages.pitch.velocity_base_ned_m_s: [0.0, 0.0, 0.0]
    stages.pitch.acceleration_base_ned_m_s2: [0.0, 0.0, 0.0]
    stages.pitch.yaw_offset_rad: 0.0
    stages.pitch.yaw_rate_base_rad_s: 0.0

    # Yaw: excite the yaw RATE, not the yaw angle.

    stages.yaw.target: "yaw_rate"
    stages.yaw.amplitude: 0.5
    stages.yaw.position_enabled: [false, false, false]
    stages.yaw.velocity_enabled: [true, true, true]
    stages.yaw.acceleration_enabled: [true, true, true]
    stages.yaw.integrator_publish_enabled: [false, false, false]
    stages.yaw.yaw_enabled: false
    stages.yaw.yaw_rate_enabled: true
    stages.yaw.velocity_base_ned_m_s: [0.0, 0.0, 0.0]
    stages.yaw.acceleration_base_ned_m_s2: [0.0, 0.0, 0.0]
    stages.yaw.yaw_offset_rad: 0.0
    stages.yaw.yaw_rate_base_rad_s: 0.0


    velocity_integrator.enabled: true
    velocity_integrator.start_delay_s: 0.1
    velocity_integrator.leak_time_constant_s: 1.33
    velocity_integrator.max_abs_velocity_m_s: 3.0


    safety.enabled: true
    safety.abort_on_violation: true
    safety.max_horizontal_deviation_m: 15.0
    # ROS 1 aborted outside 0.5..5.0 m absolute against a 2.6 m hover, i.e. -2.1/+2.4 m. This
    # symmetric limit takes the tighter side.
    safety.max_vertical_deviation_m: 2.1
    safety.max_speed_m_s: 1000.0
    safety.max_tilt_deg: 89.0
    safety.telemetry_timeout_s: 0.5

    logging.enabled: true
    logging.required: false
    # A relative path resolves against this package's source tree (baked in by CMake), NOT against
    # the launch working directory -- so this lands in Px4FrequencySweep/logs regardless of where
    # 'ros2 launch' is run from, and no machine-specific path appears in the repo. Avoid /tmp: it is
    # cleared on reboot. An absolute value is used verbatim, which is the companion-computer case:
    #   ros2 launch px4_frequency_sweep frequency_sweep.launch.py --ros-args -p \
    #     logging.directory:=/home/<user>/sweep_logs
    logging.directory: "logs"
    logging.flush_every_n_samples: 100
